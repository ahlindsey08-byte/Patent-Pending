<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patent Pending: a daily invention-year game</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#12263a;--mute:#5b6b7c;--line:#c9d6e3;--acc:#2f7fb5;--accfg:#fff;--g:#2e9e5b;--y:#d8a31a;--o:#e0782b;--r:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1622;--card:#122234;--ink:#e6eef6;--mute:#9bb0c4;--line:#27405a;--acc:#4b9cd3;--accfg:#0b1622}}
:root[data-theme="dark"]{--bg:#0b1622;--card:#122234;--ink:#e6eef6;--mute:#9bb0c4;--line:#27405a;--acc:#4b9cd3;--accfg:#0b1622}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 2.1rem/1.05 Georgia,"Times New Roman",serif;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:.9rem;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:6px 0;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:6px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center}
.em{font-size:2.4rem;line-height:1}
.nm{font:700 1.2rem/1.2 Georgia,serif;margin:0}
.cl{color:var(--mute);margin:2px 0 0;font-size:.95rem}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}
label{font-size:.9rem;color:var(--mute)}
input[type=number]{width:7.5em;font:700 1.25rem Georgia,serif;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=number]:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--acc)}
button{font-weight:700;font-size:1rem;font-family:inherit;border:0;border-radius:6px;padding:12px 18px;background:var(--acc);color:var(--accfg);cursor:pointer;width:100%}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px}
.res{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.95rem}
.pts{float:right;font:700 1.3rem Georgia,serif}
.tot{text-align:center;margin:18px 0 6px}
.tot b{font:700 3rem/1 Georgia,serif}
.grid{font-size:1.8rem;text-align:center;letter-spacing:.2em}
.stats{display:flex;justify-content:space-around;text-align:center;margin:16px 0;color:var(--mute);font-size:.85rem}
.stats b{display:block;color:var(--ink);font:700 1.4rem Georgia,serif}
textarea{width:100%;height:5.5em;margin-top:8px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.err{color:var(--r);min-height:1.3em;margin:6px 0}
.leg{color:var(--mute);font-size:.82rem;text-align:center;margin-top:10px}
.hide{display:none}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:-1;opacity:.24;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) canvas#bg{opacity:.55}}
:root[data-theme="dark"] canvas#bg{opacity:.55}
.head{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.head h1{margin-top:0}.head .sub{margin:0}
.meta{background:var(--card);padding:6px 10px}
.leg{background:var(--card);padding:6px 10px;border-radius:6px}
.rank{text-align:center;margin:18px 0 0}
.rank .ic{font-size:3.6rem;line-height:1}
.rank .tt{font:700 1.9rem/1.1 Georgia,serif}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<div class="head">
<h1>Patent Pending</h1>
<p class="sub">Three inventions. Guess the year each one was invented. The closer you are, the higher your score.</p>
</div>
<div class="meta"><span id="dn"></span><span>New objects every day</span></div>
<div id="cards"></div>
<div class="err" id="err" role="alert"></div>
<button id="go">Lock in my guesses</button>
<section id="out" class="hide">
 <div class="rank" id="rank"></div>
 <p class="leg" id="nr"></p>
 <div class="tot"><b id="tot"></b><span> / 300</span></div>
 <div class="grid" id="grid"></div>
 <button id="share">Copy score to share</button>
 <textarea id="ta" class="hide" readonly aria-label="Your score, ready to copy"></textarea>
 <div class="stats"><div><b id="s1">0</b>played</div><div><b id="s2">0</b>streak</div><div><b id="s3">0</b>best</div></div>
 <p class="leg" id="next"></p>
</section>
<p class="leg">🟩 within 5 years · 🟨 within 15 · 🟧 within 30 · 🟥 farther. Off by 50+ years scores 0.</p>
</main>
<script>
var D=[
[["Safety pin","🧷","A twist of wire with a clasp, first made to pay off a debt.",1849],["Lava lamp","🫧","Wax blobs rise and fall in a glowing bottle.",1963],["Tamagotchi","🐣","A tiny egg-shaped pet you had to feed and clean.",1996]],
[["Stethoscope","🩺","A rolled-up paper tube let a doctor listen to a chest.",1816],["Etch A Sketch","🖼️","Two knobs draw a line; shaking it erases everything.",1960],["Roomba","🤖","A disc that vacuums your floor on its own.",2002]],
[["Rubber band","➰","A loop of vulcanized rubber patented for holding things together.",1845],["Zamboni","🧊","A machine that resurfaces ice rinks.",1949],["Game Boy","🎮","A handheld console with a four-shade green screen.",1989]],
[["Pneumatic tire","🛞","An air-filled tire invented to ease a child’s bumpy tricycle ride.",1888],["Bubble wrap","📦","Meant to be textured wallpaper before it protected packages.",1957],["Emoji","😀","The first set had 176 tiny pictures made for a Japanese phone service.",1999]],
[["Kaleidoscope","🌈","A tube of mirrors and bits of glass that makes shifting patterns.",1816],["Bendy straw","🥤","A drinking straw with a flexible joint, made so a child could sip from a glass.",1937],["Pet rock","🪨","A smooth stone sold in a box with a care manual.",1975]],
[["Dishwasher","🍽️","A hand-cranked version was built to protect fine china.",1886],["Slinky","🌀","A coiled spring that walks down stairs.",1943],["Walkman","🎧","A pocket cassette player with headphones.",1979]],
[["Cotton candy machine","🍭","Spins melted sugar into fluffy threads.",1897],["Kevlar","🦺","A fiber five times stronger than steel by weight, used in body armor.",1965],["Furby","🦉","A furry talking toy that seemed to learn language.",1998]],
[["Crayons (Crayola)","🖍️","Wax sticks first sold in a box of eight.",1903],["Instant noodles","🍜","Dried noodle blocks that cook in hot water.",1958],["Pong","🏓","A two-paddle video game that started the arcade era.",1972]],
[["Jigsaw puzzle","🧩","A mapmaker cut a map into pieces to teach geography.",1767],["Parking meter","🅿️","A coin-operated timer first installed in Oklahoma City.",1935],["Mood ring","💍","A ring with a stone that supposedly changes color with your feelings.",1975]],
[["Lightning rod","⚡","A pointed metal rod that guides lightning safely to the ground.",1752],["Theremin","🎶","An instrument you play without touching it.",1920],["Pac-Man","👾","A yellow circle chased by four ghosts.",1980]],
[["Pop-up toaster","🍞","Bread springs up when it’s done, no watching needed.",1919],["Hula hoop","⭕","A plastic ring spun around the waist, sold in the millions in its first year.",1958],["Rubik’s Cube","🟥","A twisty puzzle with 43 quintillion positions.",1974]],
[["Hot-air balloon","🎈","The first passengers were a sheep, a duck, and a rooster.",1783],["Ballpoint pen","🖊️","A rolling ball transfers quick-drying ink to paper.",1938],["Wheeled suitcase","🧳","It took until the jet age for luggage to get wheels.",1970]],
[["Phonograph","📻","It recorded sound on tinfoil wrapped around a cylinder.",1877],["Scotch tape","📼","Clear cellophane tape was developed by a 3M engineer.",1930],["Barbie","👱‍♀️","A fashion doll first shown at the American Toy Fair.",1959]],
[["Band-Aid","🩹","Made so one man’s wife could bandage kitchen cuts herself.",1920],["Teflon","🍳","A slippery coating discovered by accident in a refrigerant experiment.",1938],["Computer mouse","🖱️","The first prototype was a wooden shell with two wheels.",1964]],
[["Tupperware","🥡","Airtight plastic containers with a signature burping seal.",1946],["Ring-pull can","🥫","A tab that opens a drink can without a can opener.",1963],["Tetris","🟦","Falling blocks, made by a programmer in Moscow.",1984]]
];
var RK=[{m:0,n:"Unplugged",i:"🔌"},{m:60,n:"Candlelight",i:"🕯️"},{m:120,n:"Dim Bulb",i:"🔅"},{m:170,n:"Night Light",i:"🔦"},{m:220,n:"Bright Idea",i:"💡"},{m:260,n:"Edison",i:"⚡"},{m:280,n:"Tesla",i:"🌩️"},{m:295,n:"Einstein",i:"🧠"}];
function rankOf(t){var r=RK[0];RK.forEach(function(k){if(t>=k.m)r=k});return r}
var EP=Date.UTC(2026,9,22);
function dayNum(){var d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EP)/864e5)+1}
var N=dayNum(),P=D[((N-1)%D.length+D.length)%D.length],KEY="patent-pending-v1";
function ld(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}catch(e){return {}}}
function sv(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
var S=ld();S.stats=S.stats||{played:0,streak:0,best:0,last:0};
function score(g,y){return Math.round(100*Math.max(0,1-Math.abs(g-y)/50))}
function sq(g,y){var d=Math.abs(g-y);return d<=5?"🟩":d<=15?"🟨":d<=30?"🟧":"🟥"}
var cards=document.getElementById("cards");
document.getElementById("dn").textContent="Puzzle #"+N;
P.forEach(function(it,i){
 var c=document.createElement("div");c.className="card";
 c.innerHTML='<div class="top"><div class="em" aria-hidden="true">'+it[1]+'</div><div><p class="nm">'+it[0]+'</p><p class="cl">'+it[2]+'</p></div></div>'+
 '<div class="row"><label for="n'+i+'">Year</label><input type="number" id="n'+i+'" min="1700" max="2026" step="1" inputmode="numeric" placeholder="1900">'+
 '<input type="range" id="r'+i+'" min="1700" max="2026" value="1900" aria-label="Year slider for '+it[0]+'"></div><div class="res hide" id="x'+i+'"></div>';
 cards.appendChild(c);
 var n=c.querySelector("#n"+i),r=c.querySelector("#r"+i);
 r.oninput=function(){n.value=r.value};
 n.oninput=function(){if(n.value>=1700&&n.value<=2026)r.value=n.value};
});
function show(g){
 var t=0,gr="",sh="";
 P.forEach(function(it,i){
  var s=score(g[i],it[3]);t+=s;gr+=sq(g[i],it[3]);
  var x=document.getElementById("x"+i);x.classList.remove("hide");
  var d=Math.abs(g[i]-it[3]);
  x.innerHTML='<span class="pts">+'+s+'</span>You guessed <b>'+g[i]+'</b>. It was invented in <b>'+it[3]+'</b> ('+(d===0?"exact!":d+" year"+(d>1?"s":"")+" off")+').';
  document.getElementById("n"+i).disabled=true;document.getElementById("r"+i).disabled=true;
 });
 var rk=rankOf(t),nx=RK[RK.indexOf(rk)+1];
 document.getElementById("rank").innerHTML='<div class="ic">'+rk.i+'</div><div class="tt">'+rk.n+'</div>';
 document.getElementById("nr").textContent=nx?(nx.m-t)+" more points to reach "+nx.n+" "+nx.i:"Top of the ladder. Nobody out-invents you today.";
 document.getElementById("tot").textContent=t;
 document.getElementById("grid").textContent=gr;
 document.getElementById("go").classList.add("hide");
 document.getElementById("out").classList.remove("hide");
 var st=S.stats;
 document.getElementById("s1").textContent=st.played;document.getElementById("s2").textContent=st.streak;document.getElementById("s3").textContent=st.best;
 S.text="Patent Pending #"+N+" · "+rk.i+" "+rk.n+"\n"+t+"/300\n"+gr;
 var now=new Date(),nx=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1),h=Math.ceil((nx-now)/36e5);
 document.getElementById("next").textContent="New objects in about "+h+" hour"+(h>1?"s":"")+". Come back tomorrow!";
 return t;
}
document.getElementById("go").onclick=function(){
 var g=[],e=document.getElementById("err");
 for(var i=0;i<3;i++){var v=parseInt(document.getElementById("n"+i).value,10);
  if(isNaN(v)||v<1700||v>2026){e.textContent="Enter a year from 1700 to 2026 for every object.";return}g.push(v)}
 e.textContent="";
 var t=show(g),st=S.stats;
 if(st.last!==N){st.streak=(st.last===N-1)?st.streak+1:1;st.played++;st.last=N;st.best=Math.max(st.best,t)}
 S.day=N;S.g=g;show(g);sv(S);
};
document.getElementById("share").onclick=function(){
 var ta=document.getElementById("ta");ta.value=S.text;ta.classList.remove("hide");ta.focus();ta.select();
 var b=document.getElementById("share");
 try{navigator.clipboard.writeText(S.text).then(function(){b.textContent="Copied! Paste it to your friends"},function(){b.textContent="Select the text below and copy"})}catch(e){b.textContent="Select the text below and copy"}
};
(function(){var c=document.getElementById("bg"),W=72,H=128,x;c.width=W;c.height=H;x=c.getContext("2d");
function R(a,b,w,h,f){x.fillStyle=f;x.fillRect(a,b,w,h)}
R(0,0,W,H,"#1b2b42");
for(var y=0;y<104;y+=6)for(var i=-12;i<W;i+=12){var o=(y/6%2)*6;R(i+o,y,11,5,((i+y)/6)%3?"#22365a":"#1f3253")}
R(5,9,22,26,"#0e1a2b");R(7,11,18,22,"#3a6ea5");R(15,11,2,22,"#0e1a2b");R(7,21,18,2,"#0e1a2b");R(9,13,2,2,"#cfe6ff");R(20,26,2,2,"#cfe6ff");
R(41,10,26,32,"#10335c");R(42,11,24,30,"#2f6fb0");
for(var g=0;g<24;g+=4){R(42+g,11,1,30,"#4f8fcf");R(42,11+g,24,1,"#4f8fcf")}
R(51,17,6,7,"#ffe9a0");R(52,24,4,3,"#cfd8e3");R(50,29,10,1,"#ffffff");R(46,33,14,1,"#ffffff");R(46,36,8,1,"#ffffff");
R(35,0,1,10,"#8a96a6");R(33,10,5,6,"#ffd95a");R(34,16,3,2,"#b8c2cf");R(31,8,9,11,"rgba(255,217,90,.22)");R(28,5,15,17,"rgba(255,217,90,.1)");
R(3,57,32,2,"#6b4a2b");R(3,59,2,5,"#4a3320");R(31,59,2,5,"#4a3320");
R(6,49,8,8,"#9aa7b8");R(8,51,4,4,"#1b2b42");R(5,52,10,2,"#9aa7b8");R(9,48,2,10,"#9aa7b8");
R(18,50,6,7,"#6ee0a8");R(19,48,4,2,"#cfe6ff");R(26,52,5,5,"#e07070");
R(45,62,22,2,"#6b4a2b");R(47,52,7,10,"#8f9aa8");R(49,54,3,3,"#ffd95a");R(57,56,8,6,"#4f8fcf");
R(0,100,W,6,"#7a5230");R(0,106,W,22,"#14223a");R(4,106,4,22,"#5c3d22");R(64,106,4,22,"#5c3d22");
R(10,92,10,8,"#c9d3df");R(12,90,6,2,"#c9d3df");R(13,94,2,2,"#1b2b42");R(8,95,2,3,"#8a96a6");R(20,95,2,3,"#8a96a6");
R(28,96,14,2,"#9aa7b8");R(40,94,2,6,"#9aa7b8");R(25,98,4,2,"#e07070");
R(48,90,6,10,"#ffd95a");R(49,92,4,4,"#fff3b0");R(47,100,8,1,"#b8c2cf");
R(58,94,10,6,"#6b7b8f");R(60,92,6,2,"#6b7b8f");R(61,95,2,2,"#7be0ff");R(64,95,2,2,"#7be0ff");
for(var s=0;s<14;s++)R((s*37+11)%W,(s*53+7)%90,1,1,"rgba(255,255,255,.35)")})();
if(S.day===N&&S.g){P.forEach(function(it,i){var n=document.getElementById("n"+i);n.value=S.g[i]});show(S.g)}
</script>
</body>
</html>
