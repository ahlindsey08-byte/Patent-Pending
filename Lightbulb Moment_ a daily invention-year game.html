<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lightbulb Moment: a daily invention-year game</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#12263a;--mute:#5b6b7c;--line:#c9d6e3;--acc:#2f7fb5;--accfg:#fff;--art:.24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1622;--card:#122234;--ink:#e6eef6;--mute:#9bb0c4;--line:#27405a;--acc:#4b9cd3;--accfg:#0b1622;--art:.55}}
:root[data-theme="dark"]{--bg:#0b1622;--card:#122234;--ink:#e6eef6;--mute:#9bb0c4;--line:#27405a;--acc:#4b9cd3;--accfg:#0b1622;--art:.55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:-1;opacity:var(--art);pointer-events:none}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
h1{font:700 2rem/1.05 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
.dots{display:flex;justify-content:center;gap:10px;font-size:1.3rem;margin:4px 0}
.dots span{opacity:.35}.dots .on{opacity:1;transform:scale(1.2)}
svg#bulb{display:block;margin:0 auto;width:100%;max-width:340px;height:auto;overflow:visible}
.wire{fill:none;stroke:#5a6a80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .6s}
.wire.on{stroke:#ffd95a;stroke-dasharray:6 8;animation:flow .7s linear infinite}
#bat rect{transition:fill .6s}
#zap{opacity:0;filter:drop-shadow(0 0 4px #ffd95a)}
#zap polyline{fill:none;stroke:#fff6b0;stroke-width:2.5}
#zap.go{animation:flash 1s ease-out}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes flash{0%{opacity:0}8%{opacity:1}18%{opacity:.15}28%{opacity:1}45%{opacity:.3}60%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wire.on{animation:none}#zap.go{animation:none}#glow{animation:none}#lamp.ign{animation:none}}
#glow{transition:opacity 1.1s ease,r 1.1s ease;transform-box:fill-box;transform-origin:center;animation:hum 3.4s ease-in-out infinite}
#lamp.ign{animation:flick .8s linear}
@keyframes hum{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes flick{0%{opacity:.5}12%{opacity:1}22%{opacity:.35}38%{opacity:1}52%{opacity:.7}70%{opacity:1}100%{opacity:1}}
#fil2{transition:opacity .8s ease}
#fil{transition:stroke .7s ease}
#glass{transition:fill 1.2s ease .25s,fill-opacity 1.2s ease .25s}
.em{font-size:2.2rem;line-height:1}
.nm{font:700 1.25rem/1.2 Georgia,serif;margin:6px 0 2px}
.cl{color:var(--mute);margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
input[type=number]{width:7.5em;font:700 1.25rem Georgia,serif;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=range]{flex:1;accent-color:var(--acc)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font-weight:700;font-size:1rem;font-family:inherit;border:0;border-radius:6px;padding:12px 18px;background:var(--acc);color:var(--accfg);cursor:pointer;width:100%;margin-top:12px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.res{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.pts{float:right;font:700 1.4rem Georgia,serif}
.err{color:#c0392b;min-height:1.2em;margin-top:6px}
.rank{text-align:center}.rank .ic{font-size:3.6rem;line-height:1}.rank .tt{font:700 1.9rem/1.1 Georgia,serif}
.tot{text-align:center;margin:10px 0}.tot b{font:700 2.6rem/1 Georgia,serif}
.grid{font-size:1.7rem;text-align:center;letter-spacing:.15em}
.stats{display:flex;justify-content:space-around;text-align:center;color:var(--mute);font-size:.85rem;margin-top:12px}
.stats b{display:block;color:var(--ink);font:700 1.4rem Georgia,serif}
.leg{color:var(--mute);font-size:.82rem;text-align:center;margin:0}
textarea{width:100%;height:6em;margin-top:8px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.hide{display:none}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>

<g id="zap"><polyline points="30,96 38,84 34,84 44,72 40,72 52,58"/><polyline points="92,116 102,104 97,104 108,90"/><polyline points="196,140 204,152 199,152 210,164"/><polyline points="226,106 234,96 230,96 238,86"/></g></svg></div>
<div class="panel" id="stage">
<div class="em" id="em" aria-hidden="true"></div><p class="nm" id="nm"></p><p class="cl" id="cl"></p>
<div class="row"><input type="number" id="n" min="1700" max="2026" step="1" inputmode="numeric" placeholder="1900" aria-label="Year guess"><input type="range" id="r" min="1700" max="2026" value="1900" aria-label="Year slider"></div>
<div class="err" id="err" role="alert"></div>
<button id="go">Lock in guess</button>
<div class="res hide" id="res"></div>
<button id="nx" class="hide">Next invention</button>
</div>
<div class="panel hide" id="out">
<div class="rank" id="rank"></div><p class="leg" id="nr"></p>
<div class="tot"><b id="tot"></b><span> / 500</span></div><div class="grid" id="grid"></div>
<button id="share">Copy score to share</button><textarea id="ta" class="hide" readonly aria-label="Your score, ready to copy"></textarea>

<p class="leg panel">⭐ exact · 🟢 within 10 years · 🟡 within 25 · 🟤 within 40 · ⚫ farther. Off by 50+ years scores 0.</p>
</main>
